<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metge Mir 24 · Sabadell</title>
<meta name="description" content="Metge Mir 24: 12 viviendas de obra nueva en el centro de Sabadell. Pisos de 2 y 3 dormitorios y dúplex con terraza.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: showroom inmobiliario cálido y preciso, como un dossier de venta bien editado
   IDEA: la fachada estucada con carpintería verde de la propia promoción es la interfaz
   PICTURE: el edificio a pantalla completa con plantas resaltables; el resto son módulos sobre él
   COLOUR and TYPE: estuco crema, verde carpintería, terracota de las cubiertas · Outfit + Plus Jakarta Sans
   LAYOUT: pantallas a sangre con paneles laterales en escritorio y hojas inferiores en móvil */
:root{--ink:#1b211d;--ink2:#4a524c;--mute:#7b827c;--paper:#f4ede1;--card:#fffcf6;--line:#e3d9c8;--green:#1f4d36;--green2:#2f6b4c;--terra:#b8613a;--ok:#2b8a55;--res:#d98a1f;--sold:#c0473c;--glass:rgba(255,252,246,.92);--dark:rgba(20,30,24,.86);--sh:0 10px 34px rgba(20,16,10,.22);--r:22px;--f:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;--fh:'Outfit',var(--f)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.5 var(--f);color:var(--ink);background:#121814;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--fh);font-weight:500;margin:0;letter-spacing:-.01em;text-wrap:balance}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--glass);box-shadow:var(--sh);font-weight:600;font-size:14px;backdrop-filter:blur(10px);white-space:nowrap;transition:transform .15s,background .2s}
.pill:active{transform:scale(.96)}.pill.dark{background:var(--dark);color:#fff}.pill.green{background:var(--green);color:#fff}
.pill.round{width:44px;padding:0;justify-content:center}.pill.sm{height:36px;padding:0 13px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:600;background:var(--green);color:#fff;text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.terra{background:var(--terra)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:#e4f1e8;color:#1d6b3f;white-space:nowrap}
.badge.reserved{background:#fbeed8;color:#8a5510}.badge.sold{background:#f9e2df;color:#8f2f27}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.prov{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#8a5510;background:#fbeed8;border-radius:999px;padding:3px 10px}
/* intro */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;transition:opacity .7s,visibility .7s;overflow:hidden}
#intro.out{opacity:0;visibility:hidden}
#intro .kb{position:absolute;inset:-4%;background:url(img/fac_hero.webp) center/cover;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,20,14,.62),rgba(10,20,14,.25) 70%),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55))}
.intro-c{position:relative;z-index:2;text-align:center;color:#fff;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px}
.logo{font-family:var(--fh);text-align:center;line-height:1}
.logo b{display:block;font-weight:500;letter-spacing:.28em;font-size:clamp(32px,6.4vw,58px);padding-left:.28em}
.logo span{display:block;margin-top:12px;font-size:clamp(11px,1.6vw,14px);letter-spacing:.5em;padding-left:.5em;opacity:.92}
.logo i{display:block;width:44px;height:1px;background:currentColor;margin:14px auto 0;opacity:.7}
.intro-c p{margin:0;max-width:34ch;font-size:16px;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.enter{min-width:240px;height:58px;border-radius:999px;background:#fff;color:var(--ink);font-weight:600;font-size:17px;box-shadow:var(--sh);transition:transform .2s}
.enter:hover{transform:scale(1.03)}
.langs{display:inline-flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.35)}
.langs button{height:32px;min-width:44px;padding:0 10px;border-radius:999px;font-weight:600;font-size:13px;color:#ddd}
.langs button.on{background:#fff;color:var(--ink)}
.intro-foot{position:absolute;z-index:2;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:12px;padding:0 16px}
/* shell */
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.screen.on{opacity:1;visibility:visible}
.top{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}.top .sp{flex:1;pointer-events:none}
.crumb{font:600 13px var(--f);color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.lightTop .crumb{color:var(--ink);text-shadow:none}
.top .langs{background:var(--dark)}
body.on-cfg .crumb{display:none}
@media(max-width:560px){.top .crumb{display:none}.top .agentbtn span{display:none}.top .agentbtn{width:44px;padding:0;justify-content:center}}
/* building */
#s-ed{background:#20281f}
.stage{position:absolute;inset:0;overflow:hidden}
.view{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.view.on{opacity:1}
.view img{width:100%;height:100%;object-fit:cover}
.view.on img{animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.08)}}
#ovl{position:absolute;inset:0;width:100%;height:100%}
.band{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,0);stroke-width:3;cursor:pointer;transition:fill .25s,stroke .25s;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.band:hover,.band.sel{fill:rgba(31,77,54,.42);stroke:#fff;filter:drop-shadow(0 0 10px rgba(255,255,255,.5))}
.flab{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:var(--glass);box-shadow:0 4px 16px rgba(0,0,0,.25);font-weight:600;font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s}
.flab small{font-weight:500;color:var(--mute)}
.flab.on{opacity:1}
.floors{position:absolute;z-index:15;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:26px;background:var(--glass);box-shadow:var(--sh)}
.floors button{min-width:52px;height:40px;padding:0 10px;border-radius:999px;font-weight:600;font-size:13px}
.floors button.on{background:var(--green);color:#fff}
.viewdots{position:absolute;z-index:14;left:50%;top:max(72px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--dark);max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
.viewdots button{flex:none;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;color:#c9cec9}
.viewdots button.on{background:#fff;color:var(--ink)}
.hero-t{position:absolute;z-index:12;left:22px;bottom:96px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.55);max-width:min(520px,70vw)}
.hero-t h1{font-size:clamp(28px,4.4vw,48px);line-height:1.05}
.hero-t p{margin:8px 0 0;font-size:15px}
.hero-t .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;text-shadow:none}
.hero-t .stats span{padding:7px 12px;border-radius:999px;background:var(--glass);color:var(--ink);font-weight:600;font-size:13px}
.dock{position:absolute;z-index:16;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none;width:max-content;max-width:calc(100% - 28px);margin:0 auto}
.dock::-webkit-scrollbar,.viewdots::-webkit-scrollbar{display:none}
.dock button{flex:none;height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.dock button:hover,.dock button.on{background:var(--green);color:#fff}
@media(max-width:700px){.hero-t{bottom:90px;left:16px}.hero-t .stats{display:none}.floors{top:46%}}
/* sheet */
#scrim{position:fixed;inset:0;z-index:39;background:rgba(10,12,11,.4);opacity:0;visibility:hidden;transition:.3s}
#scrim.on{opacity:1;visibility:visible}
#sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:80vh;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:9px auto 2px;flex:none}
#sheet .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:#f0e9dc;display:grid;place-items:center;z-index:2}
#sheet .body{overflow:auto;padding:10px 20px max(22px,env(safe-area-inset-bottom));overscroll-behavior:contain}
@media(min-width:900px){#sheet{left:auto;right:18px;bottom:18px;width:420px;max-height:calc(100vh - 110px);border-radius:26px;transform:translateX(120%)}#sheet .grab{visibility:hidden}#scrim.on{opacity:0}}
.sh-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:48px;margin:6px 0 4px}
.sh-h h2{font-size:24px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.facts div{padding:10px 12px;border-radius:14px;background:#f3ece0}
.facts dt{font-size:11px;color:var(--mute);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:600;font-family:var(--fh);font-size:17px;white-space:nowrap}
.ulist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.ulist button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;background:#f3ece0;transition:background .2s}
.ulist button:hover{background:#eae1d1}
.ulist b{font-family:var(--fh);font-weight:500;font-size:17px}.ulist small{display:block;color:var(--mute);font-size:12px}
.ulist .pr{font-family:var(--fh);font-size:16px;text-align:right;white-space:nowrap}.ulist .pr small{text-align:right}
.note{font-size:12px;color:var(--mute);margin:10px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
/* menu */
#menu{position:fixed;z-index:45;inset:10px;max-width:400px;background:linear-gradient(170deg,#fffcf6,#efe6d6);border-radius:26px;box-shadow:var(--sh);padding:22px 0 16px;display:flex;flex-direction:column;transform:translateX(-110%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:auto}
#menu.on{transform:none}
#menu .x{position:absolute;top:14px;right:14px}
#menu .logo{color:var(--ink);margin:18px 0 6px}#menu .logo b{font-size:28px}#menu .logo span{font-size:10px}
#menu .addr{padding:12px 24px 4px;font-size:13px;color:var(--ink2);text-align:center}
#menu nav{display:grid;margin-top:8px}
#menu nav a{display:flex;align-items:center;gap:14px;padding:13px 24px;font-size:17px;color:var(--ink2);text-decoration:none;border-left:3px solid transparent;font-family:var(--fh);cursor:pointer}
#menu nav a:hover{background:rgba(0,0,0,.04)}
#menu nav a.on{color:var(--ink);background:linear-gradient(90deg,rgba(31,77,54,.12),transparent);border-left-color:var(--green)}
#menu .foot{margin-top:auto;padding:16px 24px 0;text-align:center;font-size:12px;color:var(--mute)}
#menu .foot button{text-decoration:underline;font-size:12px;color:inherit}
/* pages */
.page{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:84px 16px 64px}
.page h1{font-size:clamp(28px,4.6vw,42px)}
.lead{color:var(--ink2);margin:6px 0 18px;max-width:62ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.tools select{height:44px;border-radius:999px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-weight:500}
.tools .count{margin-left:auto;font-size:13px;color:var(--mute);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 18px rgba(40,30,15,.09);display:flex;flex-direction:column}
.card .ph{position:relative;aspect-ratio:4/3;background:#ece4d6;cursor:pointer}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:10px;mix-blend-mode:multiply;transition:transform .5s}
.card .ph:hover img{transform:scale(1.04)}
.card .ph .badge{position:absolute;top:12px;left:12px}
.card .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font:600 12px var(--f);color:var(--mute)}
.price{font-family:var(--fh);font-size:21px;font-weight:500;white-space:nowrap}.price small{font:500 12px var(--f);color:var(--mute);white-space:normal;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:#efe6d6;color:var(--ink2);white-space:nowrap}
.card .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:6px}
.card .acts .btn{min-height:44px;font-size:14px;padding:0 10px}
.cmp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;min-height:32px}
.cmp input{width:18px;height:18px;accent-color:var(--green)}
.cmpbar{position:fixed;z-index:30;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,160%);transition:transform .3s}
.cmpbar.on{transform:translate(-50%,0)}
table.cmpt{width:100%;border-collapse:collapse;font-size:13px}
table.cmpt th,table.cmpt td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmpt th{color:var(--mute);font-weight:600;font-size:12px;width:30%}
table.cmpt td b{font-family:var(--fh);font-weight:500;font-size:16px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.box{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 4px 18px rgba(40,30,15,.08)}
.box h2{font-size:22px;margin-bottom:8px}
.box ul{margin:8px 0 0;padding-left:18px}.box li{margin:4px 0}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl li::after{content:"";position:absolute;left:10.5px;top:20px;bottom:0;width:1.5px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}.tl li.next::before{border-color:var(--terra);box-shadow:0 0 0 4px rgba(184,97,58,.2)}
.tl b{display:block;font-family:var(--fh);font-weight:500;font-size:17px}.tl small{color:var(--mute)}
.pay{margin:10px 0 0;padding:0;list-style:none}
.pay li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay li small{display:block;color:var(--mute);font-size:12px}.pay li b{font-family:var(--fh);font-weight:500;font-size:16px;white-space:nowrap}
.bar{height:10px;border-radius:10px;background:#e9e0cf;overflow:hidden;display:flex;margin:12px 0 4px}
.bar i{display:block;height:100%}
.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.field input,.field textarea,.field select{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:16px}
.field textarea{height:96px;padding:12px 14px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);margin:6px 0 12px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--green);flex:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.gal button{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:#ddd}
.gal button.w{grid-column:span 2}@media(max-width:600px){.gal button.w{grid-column:span 1}}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.gal button:hover img{transform:scale(1.05)}
.gal span{position:absolute;left:10px;bottom:10px;padding:5px 11px;border-radius:999px;background:var(--glass);font-size:12px;font-weight:600}
/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:#0d0f0e;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:.3s}
#lb.on{opacity:1;visibility:visible}
#lb .st{position:relative;flex:1;min-height:0}
#lb .st img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#lb .cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
/* unit viewer */
#s-pis{background:#ece4d6}
.uv{position:absolute;inset:66px 12px 150px;display:grid;place-items:center}
.uv img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;animation:fadeup .45s both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.tabs{display:inline-flex;padding:4px;gap:2px;height:44px;border-radius:999px;background:var(--glass);box-shadow:var(--sh)}
.tabs button{height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px}
.tabs button.on{background:var(--green);color:#fff}
.ubar{position:absolute;z-index:16;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ubar .info{display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 20px;border-radius:28px;background:var(--glass);box-shadow:var(--sh)}
.ubar .info b{font-family:var(--fh);font-weight:500;font-size:19px;white-space:nowrap}.ubar .info small{display:block;color:var(--mute);font-size:12px}
.ubar .btn{min-height:56px;box-shadow:var(--sh)}
.ref{position:absolute;z-index:14;left:50%;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 70px);transform:translateX(-50%);font-size:11px;color:var(--ink2);background:rgba(255,255,255,.75);padding:4px 10px;border-radius:999px;max-width:92vw;text-align:center}
.agentacts{display:flex;gap:6px;flex-wrap:wrap}
.agentacts .btn{min-height:44px;font-size:13px;padding:0 14px}
@media(max-width:640px){.uv{bottom:200px}.ubar .info{width:100%;justify-content:space-between}.ubar .btn{flex:1}.ref{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 136px)}}
/* split screens */
.split{display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);background:#16201a}
.split .stg{position:relative;min-height:0;overflow:hidden}
.split .pan{background:var(--card);border-radius:26px 26px 0 0;max-height:52vh;overflow:auto;padding:18px 18px max(18px,env(safe-area-inset-bottom));overscroll-behavior:contain;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.split .pan h2{font-size:23px}.cat{font-size:12px;font-weight:700;color:var(--terra)}
